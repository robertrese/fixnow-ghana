# Runs the project's checks on every push and pull request: syntax checks, the front-end policy and phase tests,
# and the backend integration test (npm run check). No secrets are used. The browser QA (Chromium, WebKit, Firefox)
# is not here yet; see design/v2-handoff/WEBSITE-GITHUB-STAFF-AND-SCREENS.md, step 9.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm run check
        run: npm run check
