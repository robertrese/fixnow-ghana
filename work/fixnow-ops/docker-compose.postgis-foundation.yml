services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixnow
      POSTGRES_USER: fixnow_migration
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
    volumes:
      - fixnow-postgis:/var/lib/postgresql/data
    networks:
      - private
    secrets:
      - postgres_migration_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixnow_migration -d fixnow"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/object_storage_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/object_storage_secret_key
    volumes:
      - fixnow-objects:/data
    networks:
      - private
    secrets:
      - object_storage_access_key
      - object_storage_secret_key

networks:
  private:
    internal: true

volumes:
  fixnow-postgis:
  fixnow-objects:

secrets:
  postgres_migration_password:
    external: true
  object_storage_access_key:
    external: true
  object_storage_secret_key:
    external: true
