<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FixNow Ghana link preview (source)</title>
<!-- Source of docs/social-preview.png, the 1200 x 630 link-preview image for the public demo.
     Rebuild it with: node work/demo/make-social-preview.js (then npm run build:demo).
     Only the logo, the name and plain text: no photos of real places. Fonts are the app's bundled ones. -->
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../../outputs/fonts/bricolage-grotesque-latin-wght.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../../outputs/fonts/atkinson-hyperlegible-next-latin-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../../outputs/fonts/atkinson-hyperlegible-next-latin-700.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0d2a22; color: #fdfaf1; font-family: "Atkinson Hyperlegible Next", sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 84px 96px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { width: 150px; height: 150px; border-radius: 16.5px; box-shadow: 0 0 0 3px rgba(253, 250, 241, .5); }
  h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 112px; line-height: 1; letter-spacing: -1px; }
  p { margin: 52px 0 0; max-width: 960px; font-size: 42px; line-height: 1.3; color: #e6efe9; }
  .demo { display: inline-block; margin-top: 40px; padding: 10px 26px; border-radius: 999px; background: #fcd116; color: #0d2a22; font-weight: 700; font-size: 30px; align-self: flex-start; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../../outputs/icon.svg" alt="" /><h1>FixNow Ghana</h1></div>
    <p>Report community problems in Ghana and follow what happens. A moderator checks every report before anything is public.</p>
    <span class="demo">Public demo with sample data</span>
  </div>
</body>
</html>
